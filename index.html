<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>Odin Calculator </title>
</head>


<body>
    <div class="header">
        <h1>Odin Calculator</h1>
    </div>

    <!-- Center Content -->
    <div class="center-content">
        <!-- left side -->
        <div class="left">
            <div class="left-header">
                <h2>Left Header</h2>
            </div>

            <p> left side </p>
        </div>

        <!-- right side -->
        <div class="right">
            <!-- right hedader -->
            <div class="right-header">
                <h2>Calculations </h2>
            </div>

            <!-- right content -->

        <div class="top"> 

            <!-- input display -->
            <div class="input-display">
                <div class="input">
                    <p>Input: <span id="input">0</span></p>
                </div>
            </div>

            <!-- result display -->
            <div class="result-display">
                <div class ="result">
                <p>Result: <span id="display">0</span></p>
            </div>
        </div>



        </div>

            <!-- button display -->
            <div class="button-display">
                <div class="buttons">

                <!-- NEEDS FIXING! -->
                    <button class="btn" id="clear">C</button>
                    <button class="btn" id="add">+</button>
                    <button class="btn" id="subtract">--</button>
                    <button class="btn" id="equals">=</button>
                    <button class="btn" id="one">1</button>
                    <button class="btn" id="two">2</button>
                    <button class="btn" id="three">3</button>
                    <button class="btn" id="multiply">X</button>
                    <button class="btn" id="four">4</button>
                    <button class="btn" id="five">5</button>
                    <button class="btn" id="six">6</button>
                    <button class="btn" id="divide">/</button>
                    <button class="btn" id="seven">7</button>
                    <button class="btn" id="eight">8</button>
                    <button class="btn" id="nine">9</button>
                    <button class="btn" id="deciaml">.</button>
                    <button class="btn" id="zero">0</button>
                </div>
            </div>


        </div>

    </div>


</body>


</html>
